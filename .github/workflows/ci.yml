name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    # labeled/unlabeled re-run the protected-path gate when `bulwark-approved` is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # hashFiles() isn't allowed in job-level `if`, so detect which parts of the repo exist first.
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.d.outputs.backend }}
      web: ${{ steps.d.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: d
        run: |
          echo "backend=$([ -f backend/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      # Bootstrapped like compose: holdfast_admin is the superuser; the "Postgres roles" step runs
      # infra/postgres/init/00-roles.sh to create holdfast_owner and holdfast_app.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: holdfast_admin
          POSTGRES_PASSWORD: holdfast-ci-admin
          POSTGRES_DB: holdfast
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U holdfast_admin -d holdfast"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Real-service tests skip locally but must run (not skip) when CI is set.
      CI: "1"
      APP_ENV: dev
      PLAID_ENV: sandbox
      # Throwaway CI-only passwords. Tests run as holdfast_app; alembic runs as holdfast_owner.
      POSTGRES_OWNER_PASSWORD: holdfast-ci-owner
      POSTGRES_APP_PASSWORD: holdfast-ci-app
      DATABASE_URL: postgresql+psycopg://holdfast_app:holdfast-ci-app@localhost:5432/holdfast
      TEST_DATABASE_URL: postgresql+psycopg://holdfast_app:holdfast-ci-app@localhost:5432/holdfast
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://holdfast_owner:holdfast-ci-owner@localhost:5432/holdfast
      TEST_MIGRATIONS_DATABASE_URL: postgresql+psycopg://holdfast_owner:holdfast-ci-owner@localhost:5432/holdfast
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0
      DOCUMENT_STORE: /tmp/holdfast-documents
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Postgres roles (same script compose mounts into /docker-entrypoint-initdb.d)
        # -e NAME passes the value from this step's env, so no password lands in argv.
        run: >-
          docker exec -i -e POSTGRES_OWNER_PASSWORD -e POSTGRES_APP_PASSWORD
          "${{ job.services.postgres.id }}" bash -s < ../infra/postgres/init/00-roles.sh
      - name: Throwaway secrets
        run: |
          fernet=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')
          session=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
          echo "::add-mask::$fernet"
          echo "::add-mask::$session"
          { echo "FERNET_KEY=$fernet"; echo "SESSION_SECRET=$session"; } >> "$GITHUB_ENV"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q
      - name: Alembic upgrade / downgrade / upgrade (as holdfast_owner)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Single Alembic head
        run: |
          heads=$(uv run alembic heads | grep -c '(head)' || true)
          echo "alembic heads: $heads"
          [ "$heads" -eq 1 ] || { echo "::error::expected exactly one Alembic head, found $heads"; exit 1; }
      - name: alembic check (models match migrations)
        run: uv run alembic check
      - name: pip-audit (blocking, expiring allowlist)
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off -f json -o "$RUNNER_TEMP/pip-audit.json" || true
          python3 ../scripts/audit_gate.py pip "$RUNNER_TEMP/pip-audit.json" ../.github/audit-allowlist.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pip-audit
          path: ${{ runner.temp }}/pip-audit.json
          if-no-files-found: ignore

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # pnpm version comes from "packageManager" in web/package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --run
      - run: pnpm build
      - name: pnpm audit (blocking at high, expiring allowlist)
        run: |
          pnpm audit --audit-level high --json > "$RUNNER_TEMP/pnpm-audit.json" || true
          python3 ../scripts/audit_gate.py pnpm "$RUNNER_TEMP/pnpm-audit.json" ../.github/audit-allowlist.yml

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # CLI image instead of gitleaks-action, which needs a paid license on organization repos.
      # PRs scan only their own commit range; pushes scan full history.
      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          opts=()
          if [ "$EVENT" = "pull_request" ]; then
            opts=(--log-opts="$BASE_SHA..$HEAD_SHA")
          fi
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact -v "${opts[@]}" /repo

  protected-paths:
    # Protected paths and test deletions/skips need the `bulwark-approved` label (SDLC section 2).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check protected paths and test removals
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash scripts/check-protected-paths.sh

  compose:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Throwaway .env
        run: python3 scripts/gen-keys.py --write
      - name: docker compose config
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          TAILSCALE_BIND_IP=100.64.0.1 APP_HOST=holdfast.example.com CF_API_TOKEN=ci-placeholder \
            docker compose -f docker-compose.yml -f infra/docker-compose.prod.yml config -q
      - name: No ports beyond the rules (CLAUDE.md rule 12), prod renders APP_ENV=prod
        run: |
          docker compose config --format json | python3 scripts/check-compose-ports.py
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --format json \
            | python3 scripts/check-compose-ports.py --dev
          TAILSCALE_BIND_IP=100.64.0.1 APP_HOST=holdfast.example.com CF_API_TOKEN=ci-placeholder \
            docker compose -f docker-compose.yml -f infra/docker-compose.prod.yml config --format json \
            | python3 scripts/check-compose-ports.py --prod
      - name: Validate Caddyfiles
        run: |
          docker run --rm -v "$PWD/infra/caddy:/etc/caddy:ro" -e APP_HOST=localhost -e WEB_UPSTREAM=web:80 \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          # Prod image bundles Caddyfile.prod; the DNS provider only checks the token's format.
          docker build -t holdfast-caddy:ci -f infra/caddy/Dockerfile.prod infra/caddy
          docker run --rm -e APP_HOST=holdfast.example.com -e WEB_UPSTREAM=web:80 \
            -e CF_API_TOKEN="$(python3 -c 'print("x" * 40)')" \
            holdfast-caddy:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: docker compose build
        if: needs.detect.outputs.backend == 'true' && needs.detect.outputs.web == 'true'
        run: docker compose build
      - name: Remove throwaway .env
        if: always()
        run: rm -f .env

  # New pushes invalidate a Bulwark sign-off: drop the label on every synchronize.
  revoke-approval:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Remove bulwark-approved
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh api -X DELETE "repos/$REPO/issues/$PR/labels/bulwark-approved" || echo "label not present"

  # The single stable required check. Jobs skipped by `detect` count as passing; failed or
  # cancelled jobs do not. Add every new job to `needs`.
  ci-required:
    if: always()
    needs: [detect, backend, web, secrets, protected-paths, revoke-approval, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate needed jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          bad = {k: v["result"] for k, v in json.loads(os.environ["RESULTS"]).items()
                 if v["result"] not in ("success", "skipped")}
          for k, v in bad.items():
              print(f"::error::{k}: {v}")
          sys.exit(1 if bad else 0)
          PY
