version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule: { interval: "weekly" }
  - package-ecosystem: "npm"
    directory: "/web"
    schedule: { interval: "weekly" }
  # Actions are pinned by full SHA with a version comment; Dependabot keeps both in step.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule: { interval: "weekly" }
