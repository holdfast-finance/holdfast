# Project permissions. .claude/settings.json allow/ask/deny lists also load.
# These denies cover secret paths at any depth, including absolute tool paths.

[permission]
deny = [
  "Read(**/.env)",
  "Read(**/.env.*)",
  "Read(**/secrets/**)",
  "Read(**/data/**)",
  "Edit(**/.env)",
  "Edit(**/.env.*)",
  "Edit(**/secrets/**)",
  "Edit(**/data/**)",
  "Bash(cat .env)",
  "Bash(cat ./.env)",
  "Bash(cat .env.local)",
  "Bash(cat ./.env.local)",
  # Agents must not rewrite their own guards: agent and CI config is Keel's, reviewed by Bulwark.
  "Edit(**/.claude/**)",
  "Edit(**/.codex/**)",
  "Edit(**/.agents/**)",
  "Edit(**/.grok/**)",
  "Edit(**/.githooks/**)",
  "Edit(**/AGENTS.md)",
  "Edit(**/CLAUDE.md)",
  "Edit(**/.gitleaks.toml)",
  "Edit(**/.gitleaksignore)",
  "Edit(**/scripts/agent_guard.py)",
  "Edit(**/scripts/bip39_english.txt)",
  "Edit(**/scripts/external-agent-launch.sh)",
  # GitHub: no merging, reviewing, labelling, releasing or settings changes. `gh api` can do all of it.
  "Bash(gh pr merge*)",
  "Bash(gh pr review*)",
  "Bash(gh pr edit*)",
  "Bash(gh issue edit*)",
  "Bash(gh label*)",
  "Bash(gh release*)",
  "Bash(gh secret*)",
  "Bash(gh ruleset*)",
  "Bash(gh repo edit*)",
  "Bash(gh repo delete*)",
  "Bash(gh workflow*)",
  "Bash(gh api*)",
  # git: no push to main in any form (the fork's `origin` takes branches only), no tags, no hook bypass.
  "Bash(git push upstream*)",
  "Bash(git push* main*)",
  "Bash(git push*:main*)",
  "Bash(git push*:refs/heads/main*)",
  "Bash(git push*--force*)",
  "Bash(git push* -f*)",
  "Bash(git push*--mirror*)",
  "Bash(git push*--delete*)",
  "Bash(git tag*)",
  "Bash(git -C*)",
  "Bash(git -c*)",
  "Bash(git --git-dir*)",
  "Bash(git --work-tree*)",
  "Bash(git commit* -n*)",
  "Bash(git commit*--no-verify*)",
  "Bash(git config*hooksPath*)",
  # Shell wrappers hide the real command from these patterns.
  "Bash(bash -c*)",
  "Bash(bash -lc*)",
  "Bash(sh -c*)",
  "Bash(zsh -c*)",
  "Bash(dash -c*)",
]
