# Project permissions. .claude/settings.json allow/ask/deny lists also load.
# These denies cover secret paths at any depth, including absolute tool paths.

[permission]
deny = [
  "Read(**/.env)",
  "Read(**/.env.*)",
  "Read(**/secrets/**)",
  "Read(**/data/**)",
  "Edit(**/.env)",
  "Edit(**/.env.*)",
  "Edit(**/secrets/**)",
  "Edit(**/data/**)",
  "Bash(cat .env)",
  "Bash(cat ./.env)",
  "Bash(cat .env.local)",
  "Bash(cat ./.env.local)",
  "Bash(gh pr merge:*)",
  "Bash(gh label:*)",
  "Bash(gh issue edit:*)",
  "Bash(gh pr edit:*)",
  "Bash(gh api:*)",
  "Bash(git push --force:*)",
  "Bash(git push -f:*)",
  "Bash(git push --force-with-lease:*)",
  "Bash(git push origin main:*)",
  "Bash(git push origin HEAD:main:*)",
  "Bash(git commit --no-verify:*)",
  "Bash(git -c:*)",
  "Bash(git tag:*)",
  "Read(**/exports/**)",
  "Edit(**/exports/**)",
]
