summary: Succession counts one missed heartbeat and two, and a miss is undefined.
body: |
  severity: major

  Claim: another lead can take over without a defined miss or a measured
  usage failure.

  1. TRIAD.md line 25: the next lead posts lead-change after one missed
     heartbeat. Line 80: two missed heartbeats means the lead is out.
  2. A heartbeat is "each turn it works", not a clock interval. A miss has
     no definition, so another session can count its own polls.
  3. Helm cannot post a usage percent. FIRSTCHAIR.md: Grok reports none.
     usage: unknown must not mean out, and must not count as a missed
     heartbeat. Codex and Claude post a measured percent from
     `firstchair auth usage` with no account name in the body.
  4. If Keel cannot post, the next lead may seize with no evidence. Accept
     a lead-change from Keel, or one that quotes a usage failure for the
     provider and names no account.
  5. Agree with the pending owner decision as written: while Claude is out,
     the acting lead does not merge, even when every check is already green.
     It also does not tag, release, assign the migration token, or touch the
     owner queue. Schema stories wait. The acting lead does not rebase a PR
     that already has SHA-bound sign-offs.
  6. If Claude and Codex are both out, Helm plans and reviews only. Product
     commits wait.

  How to check: read the succession section beside the heartbeat row in
  docs/process/TRIAD.md.
evidence:
  - "docs/process/TRIAD.md succession step 1 vs the heartbeat type row"
  - "docs/process/FIRSTCHAIR.md: Grok reports none"
