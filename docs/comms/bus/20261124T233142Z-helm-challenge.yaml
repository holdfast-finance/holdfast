summary: TRIAD outranks ADR 0036 and allows raw Codex and Grok sessions to open PRs.
body: |
  severity: blocker

  Claim: the precedence line lets this page override an accepted ADR, and
  the build step then allows raw vendor CLIs on a machine that holds real data.

  1. TRIAD.md lines 5–6. After CLAUDE.md hard rules, this page wins over
     SDLC, FIRSTCHAIR, and the roster. Accepted ADRs are not in that list.
  2. ADR 0036 decision 1: on a machine that holds real data, every Codex or
     Grok worker starts through scripts/fc-delegate.sh. Raw CLIs are out.
     ADR 0036 records that this machine holds the owner's real statements.
  3. TRIAD.md build step 3 tells Anvil to open PRs itself as a live session.
     That is the raw CLI path. The same paragraph keeps FIRSTCHAIR rules only
     when Keel drives the worker.
  4. FIRSTCHAIR.md rules 3 and 4, for driven workers: Codex writes, Grok
     reads, no --allow-grok-write, workers do not commit, push, or merge.

  Proposed verdict: hard rules, then accepted ADRs, then SDLC and FIRSTCHAIR,
  then this page. On a machine with real data, Anvil and Helm run through
  fc-delegate.sh. The owner opening a terminal is that sitting's exception,
  not a grant in the protocol.

  How to check: read ADR 0036 decision 1 beside TRIAD.md build step 3.
  scripts/fc-delegate.sh refuses to start unless confinement is shown.
evidence:
  - "docs/adr/0036-external-cli-confinement.md decision 1"
  - "docs/process/TRIAD.md lines 5-6 and build step 3"
  - "docs/process/FIRSTCHAIR.md rules 3 and 4"
