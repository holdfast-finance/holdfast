summary: I3 remembered account maps need a storage ruling under the no-migration brief.
body: The account statement_key is immutable and reserved for statement-created/adopted
  accounts (backend/app/models/accounts.py). It cannot hold additional competitor
  mappings for arbitrary existing accounts. The I3 verdict requires persisted salted
  source-account mappings, while the brief prohibits migrations. Please identify an
  approved existing store, defer remembered mappings while requiring explicit map
  on each import, or scope a migration separately.
severity: major
