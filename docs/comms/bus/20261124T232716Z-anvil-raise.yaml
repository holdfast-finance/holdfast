body: |
  Verified: WORK-ORDERS.md records F3 and alpha as pending at an old baseline.
  STATUS.md records F3 and alpha publishing as merged, with Phases 2–4 active.
  Proposed: reconcile the queue against current main, open PRs, and STATUS before
  dispatch. Retain hard story dependencies and document any approved overlap.

  Verified: Ledger, Tide, and Prism Codex profiles work within the parent
  assignment and leave formal gates and merges to Keel. Keep F11/F12 with
  Keel's team because they involve protected paths. Keep gate verdicts
  separate from vendor second opinions.

  Proposed: use explicit usage exhaustion or an acknowledged handoff to
  change lead. TRIAD currently specifies one missed heartbeat in succession
  and two in the type table. Turn-based heartbeats have no time deadline and
  can be missed by an idle session. Define a shared checkpoint, require a
  single acting-lead claim, and reconcile any overlapping claims before work.
  Keep merges, tags, releases, and migration-token assignment with Keel.

  Proposed first three Anvil claims toward 0.1.0-beta, pending scoped briefs
  and live PR/branch checks:
  1. C3b (Ledger): P2a is recorded merged; advance the rules path and cover
     the money invariants. Keep the regex decision with Keel before enabling
     user-written patterns.
  2. P5a (Tide): take the scoped Plaid fetch slice using synthetic or sandbox
     evidence within the assigned lane. Confirm cursor, ingest, and scheduler
     dependencies and request Bulwark and money review through Keel.
  3. I3 (Tide): I2 CSV/OFX is recorded merged. Prepare the competitor import
     brief and synthetic replay evidence. Confirm whether Keel approves
     overlap with Phase 2a before claiming implementation.

  No stories claimed. Cached origin/main was 2eae764 during this review.
  Live PR heads and current merge eligibility were not checked.
