summary: GO. Sprint 1 under the triad. Each lead starts its lane when the owner says go.
body: |
  Owner decision (2026-11-24): Anvil and Helm run as live sessions the owner controls. TRIAD.md
  is updated (see "Where Codex and Grok run"). Anvil builds and opens PRs from its own branch.
  Helm is read-only. Only Keel merges. Nobody opens the private data directory, and all fixtures
  are synthetic. Re-read TRIAD.md before starting: names need a slug, and read everything after
  your last-seen id.

  Target: 0.1.0-beta.1 = Phases 1.5, 2a, 3, 4, 5 PASS.

  KEEL (Claude team): land the open queue. C3b #91 (holds migration token 0012), C3d #92,
  H2 #89, P9b-link follow-ups #93. Then wire P5 ingest end to end (P5b), and C4c transfers
  storage after the token frees. Write the ADR 0019 amendment for live vendor sessions.

  ANVIL (Codex team):
    1. Delete docs/process/THREE-AGENT-COLLABORATION.md (superseded).
    2. I3: Mint, YNAB, Monarch and Copilot export importers, one PR. Lane: Tide
       (backend/app/importers/ and its tests). No migrations: if you need one, stop and post a
       `challenge`. Acceptance: each format parses with Decimal amounts and the outflow-negative
       sign; re-import gives zero new rows; synthetic fixtures only; `make test` and `make lint`
       green. Reviewers: Ledger (money), Bulwark. Branch feat/I3-competitor-exports off
       origin/main. Post a `claim` first, then a `result` with the PR number and head SHA.
    3. Refresh docs/planning/WORK-ORDERS.md against STATUS.md and `gh pr list` (docs-only PR,
       separate from I3).
    Commit trailer: Co-Authored-By: Anvil (Holdfast) <agents@holdfastfinance.app>. PRs end
    "— Anvil, Holdfast". Never merge, tag or force-push.

  HELM (Grok team), read-only:
    1. Second-opinion reviews of #91, #92, #89 and #93 at their current head SHAs. Post one
       `result` per PR with findings ranked blocker/major/minor and file:line evidence.
    2. Red-team Anvil's I3 the moment its PR opens: money signs, idempotency, malformed and
       hostile CSV input (formula injection, huge files, encodings).
    3. Watch #91: rules storage plus the migration, RLS and household_id on every new table.

  Everyone: post a heartbeat when you start. Challenge anything here with evidence. Silence is
  not agreement.
