[project]
name = "holdfast-finance"
version = "0.0.0a0"
description = "Holdfast API and worker: self-hosted personal finance."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Holdfast contributors" }]
keywords = ["personal-finance", "self-hosted", "fastapi", "privacy"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "arq>=0.26",
    "redis>=5.2",
    "cryptography>=43",
    "structlog>=24.4",
    "argon2-cffi>=25.1.0",
    "pyotp>=2.12.0",
    "webauthn>=3.0.1",
    "pyyaml>=6.0",
    # Statement import reads PDFs in the api and worker, so this is not optional.
    "pdfplumber>=0.11.10",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "google-re2==1.1.20251105",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "hypothesis>=6.170.15",
    "import-linter>=2.17",
    "reportlab>=5.1.0",
    "pdfplumber>=0.11.10",
    "types-pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/holdfast-finance/holdfast"
Source = "https://github.com/holdfast-finance/holdfast"
Issues = "https://github.com/holdfast-finance/holdfast/issues"
Changelog = "https://github.com/holdfast-finance/holdfast/releases"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Distribution name is `holdfast-finance` (PyPI `holdfast` belongs to someone else).
# The import package stays `app`; the Docker image still runs from source.
[tool.hatch.build.targets.wheel]
packages = ["app"]

# Alembic ships inside the package so a wheel install can migrate: point alembic at
# `<site-packages>/app/alembic.ini`, which resolves `migrations` relative to itself.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "app/migrations"
"alembic.ini" = "app/alembic.ini"

[tool.hatch.build.targets.sdist]
include = ["/app", "/migrations", "/alembic.ini", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.sdist.force-include]
"../LICENSE" = "LICENSE"

[tool.uv]
# The Docker image runs from source (`app` package), so `uv sync` does not install the project.
# `uv build` still produces the wheel and sdist from [build-system].
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["arq", "arq.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "services: needs real Postgres and Redis (TEST_DATABASE_URL / REDIS_URL)",
    "strict_probe: runs the save-time cost probe at its real 10 microsecond limit",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

# Layering (ADR 0011): api (thin) -> services (transactions, auth, audit) -> domain (pure).
# Run with `make lint-imports` (part of `make lint`).
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api -> services -> domain"
type = "layers"
layers = ["app.api", "app.services", "app.domain"]

[[tool.importlinter.contracts]]
name = "Domain is pure: no I/O, no framework, no persistence"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.api",
    "app.services",
    "app.db",
    "app.db_context",
    "app.models",
    "app.integrations",
    "app.worker",
    "app.jobs",
    "app.config",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "psycopg",
    "redis",
    "arq",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Connectors stay at the edge: no request, persistence or job code"
type = "forbidden"
source_modules = ["app.integrations"]
forbidden_modules = [
    "app.api",
    "app.services",
    "app.db",
    "app.db_context",
    "app.models",
    "app.jobs",
]

[[tool.importlinter.contracts]]
name = "Routers never touch ORM models or sessions (services own the unit of work)"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.models", "app.db", "app.db_context"]
# Direct imports only: routers reach these through services, which is the point.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only app.jobs and app.worker import the job runner (household-wide paths; ADR 0016)"
type = "forbidden"
# Every top-level module but app.jobs and app.worker. tests/jobs/test_job_boundaries.py also
# fails if enqueue_household_wide is named anywhere else, so a new package can't slip past.
source_modules = [
    "app.agent",
    "app.api",
    "app.config",
    "app.db",
    "app.db_context",
    "app.domain",
    "app.importers",
    "app.integrations",
    "app.logging",
    "app.main",
    "app.models",
    "app.notify",
    "app.openapi_export",
    "app.schemas",
    "app.security",
    "app.services",
    "app.tax",
]
forbidden_modules = ["app.jobs.runner"]

[[tool.importlinter.contracts]]
name = "Job handlers use JobContext sessions, never their own (ADR 0016)"
type = "forbidden"
source_modules = ["app.jobs.handlers"]
forbidden_modules = ["app.db", "app.db_context"]
# Direct imports only: handlers call services, which own sessions through db_context.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Job handlers never import the runner (no household-wide enqueue, no claims; ADR 0016)"
type = "forbidden"
source_modules = ["app.jobs.handlers"]
forbidden_modules = ["app.jobs.runner"]
