[project]
name = "holdfast"
version = "0.0.0"
description = "Holdfast API and worker: self-hosted personal finance."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "arq>=0.26",
    "redis>=5.2",
    "cryptography>=43",
    "structlog>=24.4",
    "argon2-cffi>=25.1.0",
    "pyotp>=2.12.0",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "hypothesis>=6.170.15",
    "import-linter>=2.17",
]

[tool.uv]
# The app is run from source (`app` package); it is not built as a wheel.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["arq", "arq.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "services: needs real Postgres and Redis (TEST_DATABASE_URL / REDIS_URL)",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

# Layering (ADR 0011): api (thin) -> services (transactions, auth, audit) -> domain (pure).
# Run with `make lint-imports` (part of `make lint`).
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api -> services -> domain"
type = "layers"
layers = ["app.api", "app.services", "app.domain"]

[[tool.importlinter.contracts]]
name = "Domain is pure: no I/O, no framework, no persistence"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.api",
    "app.services",
    "app.db",
    "app.db_context",
    "app.models",
    "app.integrations",
    "app.worker",
    "app.jobs",
    "app.config",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "psycopg",
    "redis",
    "arq",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Routers never touch ORM models or sessions (services own the unit of work)"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.models", "app.db", "app.db_context"]
# Direct imports only: routers reach these through services, which is the point.
allow_indirect_imports = true
