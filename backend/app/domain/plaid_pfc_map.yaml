# Plaid Personal Finance Category (PFC) -> default category slug.
#
# Every PRIMARY and DETAILED code in the official taxonomy file is either under `map:` (a slug from
# category_tree.yaml) or under `unmapped:` with a reason. tests/domain/test_category_tree.py fails
# when a taxonomy code is in neither, when a code is in both, or when a slug does not exist.
# A detailed code resolves first; a primary code is the fallback for a detailed code Plaid adds
# later. Mapping is a suggestion for automated categorisation; a user's own choice always wins.
taxonomy_file: plaid_pfc_taxonomy.yaml  # source URL, retrieval date and upstream hash live there

primary:
  INCOME: income.other
  TRANSFER_IN: transfers.other
  TRANSFER_OUT: transfers.other
  LOAN_PAYMENTS: debt.other
  BANK_FEES: fees.bank-fees
  ENTERTAINMENT: entertainment.other
  FOOD_AND_DRINK: food.other
  HOME_IMPROVEMENT: housing.other
  MEDICAL: health.other
  PERSONAL_CARE: health.personal-care
  GENERAL_SERVICES: fees.other-services
  TRANSPORTATION: transport.other
  TRAVEL: travel.other
  RENT_AND_UTILITIES: utilities.other

