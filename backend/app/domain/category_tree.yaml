# Default category tree: group -> category (two levels). Generic names only (hard rule 13).
#
# A category's stable machine key is "<group slug>.<category slug>"; a group's is its own slug.
# Households are seeded from this file once per slug and may then rename, hide or add categories
# (ADR 0022); the slug never changes. Do not rename or remove a slug once released: add a new one.
#
# kind: income | expense | transfer | savings | excluded
# counts_toward_spending: defaults to (kind == expense); set explicitly to override.
# essential: true marks a need rather than a want; defaults to false (a group sets the default).
version: 1
groups:
  - slug: income
    name: Income
    kind: income
    categories:
      - {slug: wages, name: Wages and salary}
      - {slug: interest, name: Interest earned}
      - {slug: dividends, name: Dividends}
      - {slug: pension, name: Pension and retirement income}
      - {slug: benefits, name: Benefits and unemployment}
      - {slug: tax-refund, name: Tax refund}
      - {slug: other, name: Other income}

  - slug: transfers
    name: Transfers
    kind: transfer
    categories:
      - {slug: account, name: Account transfer}
      - {slug: credit-card-payment, name: Credit card payment}
      - {slug: cash-withdrawal, name: Cash withdrawal}
      - {slug: deposit, name: Deposit}
      - {slug: loan-proceeds, name: Loan and cash advance proceeds}
      - {slug: other, name: Other transfer}
      - {slug: ignored, name: Ignored, kind: excluded}

  - slug: housing
    name: Housing
    kind: expense
    essential: true
    categories:
      - {slug: rent, name: Rent}
      - {slug: mortgage, name: Mortgage}
      - {slug: maintenance, name: Repairs and maintenance}
      - {slug: furnishings, name: Furniture and furnishings, essential: false}
      - {slug: home-supplies, name: Hardware and home supplies}
      - {slug: security, name: Home security}
      - {slug: other, name: Other housing}

  - slug: utilities
    name: Utilities
    kind: expense
    essential: true
    categories:
      - {slug: electricity-gas, name: Electricity and gas}
      - {slug: water, name: Water}
      - {slug: waste, name: Sewage and waste}
      - {slug: internet-cable, name: Internet and cable, essential: false}
      - {slug: phone, name: Phone}
      - {slug: other, name: Other utilities}

  - slug: food
    name: Food and drink
    kind: expense
    categories:
      - {slug: groceries, name: Groceries, essential: true}
      - {slug: restaurants, name: Restaurants}
      - {slug: fast-food, name: Fast food}
      - {slug: coffee, name: Coffee}
      - {slug: alcohol, name: Beer, wine and liquor}
      - {slug: other, name: Other food and drink}

  - slug: transport
    name: Transportation
    kind: expense
    categories:
      - {slug: fuel, name: Fuel, essential: true}
      - {slug: public-transit, name: Public transit, essential: true}
      - {slug: parking, name: Parking}
      - {slug: tolls, name: Tolls}
      - {slug: rideshare, name: Taxis and ride shares}
      - {slug: auto-service, name: Auto service and repair, essential: true}
      - {slug: bikes-scooters, name: Bikes and scooters}
      - {slug: other, name: Other transportation}

  - slug: health
    name: Health and personal care
    kind: expense
    categories:
      - {slug: medical, name: Doctor and primary care, essential: true}
      - {slug: dental, name: Dental, essential: true}
      - {slug: vision, name: Eye care, essential: true}
      - {slug: nursing, name: Nursing and home care, essential: true}
      - {slug: pharmacy, name: Pharmacy and supplements, essential: true}
      - {slug: fitness, name: Gym and fitness}
      - {slug: personal-care, name: Hair, beauty and personal care}
