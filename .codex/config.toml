default_permissions = "holdfast"

[agents]
max_concurrent_threads_per_session = 4

[shell_environment_policy.set]
PLAID_ENV = "sandbox"

# Default for trusted local CLI sessions.
[permissions.holdfast]
description = "Holdfast workspace with private financial data and environment files denied."
extends = ":workspace"

[permissions.holdfast.filesystem]
glob_scan_max_depth = 5

[permissions.holdfast.filesystem.":workspace_roots"]
# Globs match existing paths without requiring mount targets in fresh checkouts.
"**/.env" = "deny"
"**/.env.*" = "deny"
"data/**" = "deny"
"secrets/**" = "deny"
"exports/**" = "deny"
".aws/**" = "deny"
".claude" = "read"
"CLAUDE.md" = "read"
".codex/hooks.json" = "read"
".codex/hooks/**" = "read"
".codex/rules/**" = "read"
".codex/config.toml" = "read"
".grok/hooks/**" = "read"
".grok/config.toml" = "read"
".githooks/**" = "read"
"scripts/fc-delegate.sh" = "read"
