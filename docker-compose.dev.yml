# Dev override: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# (or `make up` / `./scripts/dev.ps1 up`). Hot reload for api and web; Caddy proxies to Vite.
#
# The backend image keeps its venv at /opt/venv, so ./backend can mount straight over /app.
# The anonymous node_modules volume keeps the container's deps from being hidden by ./web;
# `make up` passes --renew-anon-volumes so it refreshes on each up.

services:
  db:
    # Dev only, loopback only: lets host-side `uv run pytest` reach Postgres.
    # The base `backend` network is internal (no publishing), so dev also joins `frontend`.
    networks: [backend, frontend]
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    # Dev only, loopback only: lets host-side `uv run pytest` reach Redis.
    networks: [backend, frontend]
    ports:
      - "127.0.0.1:56379:6379"

  api:
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    read_only: false
    volumes:
      - ./backend:/app

  worker:
    read_only: false
    volumes:
      - ./backend:/app

  # New migrations under ./backend/migrations run without an image rebuild.
  migrate:
    volumes:
      - ./backend:/app

  web:
    image: node:24-alpine
    build: !reset null
    working_dir: /app
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      npm_config_store_dir: /pnpm-store
      CI: "true"
    command:
      - sh
      - -c
      - corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 5173
    read_only: false
    tmpfs: !reset []
    volumes:
      - ./web:/app
      - /app/node_modules
      - pnpm_store:/pnpm-store

  caddy:
    environment:
      WEB_UPSTREAM: web:5173

volumes:
  pnpm_store:
